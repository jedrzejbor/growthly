# The worktree launcher supplies SUPABASE_PROJECT_ID and SUPABASE_DB_PORT.
# Empty defaults make an unscoped CLI invocation fail before it creates containers.
project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 0
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

[storage]
enabled = true

[analytics]
enabled = false
